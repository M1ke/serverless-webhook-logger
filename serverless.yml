service: webhook-logger

useDotenv: true

provider:
    name: aws
    region: eu-west-1
    runtime: php-85-fpm
    iam:
        role: ${env:ENV_ROLE}
    environment:
        RELAY: ${env:ENV_RELAY}

plugins:
    - ./vendor/bref/bref

package:
    patterns:
        - '!.terraform/**'
        - '!bin/**'
        - '!.git/**'
        - '!.idea/**'
        - '!*.tfstate*'
        - '!composer.phar'
        - '!*.tf'
        - '!terraform.tfvars'
        - '!terraform.tfvars.example'
        - '!composer.json'

functions:
    api:
        handler: index.php
        description: ''
        timeout: 28 # in seconds (API Gateway has a timeout of 29 seconds)
        events:
            -   http: 'ANY /'
            -   http: 'ANY /{proxy+}'
